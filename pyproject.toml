[project]
name = "coderemote"
version = "0.1.0"
description = "Start Claude Code and Codex remote-control sessions on your own machine from a web page."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
coderemote = "coderemote.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coderemote"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
